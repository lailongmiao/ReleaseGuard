name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      JWT_SECRET_KEY: "releaseguard-ci-only-not-a-secret-32chars" # pragma: allowlist secret
      LOCAL_MVP_ENABLED: "true"
      LOCAL_MVP_ONLY: "true"
      LOG_DIR: "."
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync --all-extras --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q
